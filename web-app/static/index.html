<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pobieracz filmów z YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="banner">
      <span class="rune">ᛝ</span>
      <h1>Pobieracz Filmów</h1>
      <span class="rune">ᛝ</span>
    </div>
    <p class="subtitle">Wklej link, wybierz jakość i kliknij Pobierz.</p>

    <label for="urls">Link(i) do filmu (jeden na linię, można wkleić kilka)</label>
    <textarea id="urls" rows="4" placeholder="https://www.youtube.com/watch?v=..."></textarea>

    <div class="row">
      <div class="field">
        <label for="quality">Jakość</label>
        <select id="quality">
          <option value="best">Najlepsza jakość (wideo + audio)</option>
          <option value="1080p">1080p (mp4)</option>
          <option value="720p">720p (mp4)</option>
          <option value="480p">480p (mp4)</option>
          <option value="audio">Tylko audio (mp3)</option>
        </select>
      </div>
      <div class="field">
        <label for="browser">Ciasteczka z przeglądarki</label>
        <select id="browser">
          <option value="none">(brak)</option>
          <option value="chrome">chrome</option>
          <option value="firefox">firefox</option>
          <option value="edge">edge</option>
          <option value="brave">brave</option>
          <option value="opera">opera</option>
          <option value="safari">safari</option>
        </select>
      </div>
    </div>

    <div class="row options-row">
      <div class="field checkbox-field">
        <label class="checkbox-label"><input type="checkbox" id="subtitles"> Pobierz napisy, języki:</label>
        <input type="text" id="sub_langs" value="pl,en" disabled>
      </div>
      <div class="field checkbox-field">
        <label class="checkbox-label"><input type="checkbox" id="embed_metadata" checked> Osadź metadane i miniaturkę</label>
      </div>
    </div>

    <div class="row options-row">
      <div class="field checkbox-field">
        <label class="checkbox-label"><input type="checkbox" id="playlist"> Cała playlista, zakres (opcjonalnie):</label>
        <input type="text" id="playlist_range" placeholder="np. 1-5" disabled>
      </div>
    </div>

    <label for="output_dir">Folder zapisu</label>
    <div class="folder-row">
      <input type="text" id="output_dir" placeholder="Ładowanie domyślnej ścieżki...">
      <button id="pick_folder_btn" type="button">Wybierz...</button>
    </div>

    <div class="button-row">
      <button id="download_btn">Pobierz</button>
      <button id="retry_btn" disabled>Ponów nieudane</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div id="progress_fill" class="progress-fill"></div></div>
      <span id="progress_label">Gotowy.</span>
    </div>

    <label>Status pobrań</label>
    <div id="items_list" class="items-list"></div>

    <label>Log</label>
    <pre id="log"></pre>

    <p class="note">
      Jeśli film jest prywatny/niepubliczny, a masz do niego dostęp, wybierz w polu
      „Ciasteczka z przeglądarki” przeglądarkę, w której jesteś zalogowany na koncie
      z uprawnieniami do tego filmu.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
